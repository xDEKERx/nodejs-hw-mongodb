tags:
  - Contacts
summary: Update contact by ID
description: Update an existing contact by ID
operationId: updateContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
        example:
          name: Jane Doe
          phoneNumber: '+380000000005'
          isFavourite: true
    multipart/form-data:
      schema:
        type: object
        properties:
          photo:
            type: string
            format: binary
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: ['work', 'home', 'personal']

responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
