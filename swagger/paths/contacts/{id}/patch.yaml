tags:
  - Contacts
summary: Update contact by id
operationId: UpdateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  description: Fields to update in the contact
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+380509215077'
          email:
            type: string
            description: "Contact's email"
            example: 'example@mail.com'
          isFavourite:
            type: boolean
            description: "Contact's is Favourite mark"
            example: false
          contactType:
            type: string
            description: "Contact's type"
            enum: ['personal', 'home', 'work']
            example: 'personal'
      example:
        name: 'John Doe'
        phoneNumber: '+380509215077'
        email: 'example@mail.com'
        isFavourite: false
        contactType: 'personal'
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+380509215077'
          email:
            type: string
            description: "Contact's email"
            example: 'example@mail.com'
          isFavourite:
            type: boolean
            description: "Contact's is Favourite mark"
            example: false
          contactType:
            type: string
            description: "Contact's type"
            enum: ['personal', 'home', 'work']
            example: 'personal'
          photo:
            type: string
            format: binary
            description: "Contact's photo"
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patch contact with id 65ca67e7ae7f10c88b598384!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
