tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Sends a password reset email with a reset token/link
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            example: johndoe@mail.com
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
  '404':
    $ref: ../../components/responses/404.yaml
