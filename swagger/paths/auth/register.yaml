tags:
  - Auth
summary: User registration
operationId: registerUser
description: Register a new user
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            example: johndoe@mail.com
          password:
            type: string
            example: password123
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              properties:
                _id:
                  type: string
                  example: 65e4decdd286b30065d54af9
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: johndoe@mail.com
  '404':
    $ref: ../../components/responses/404.yaml
